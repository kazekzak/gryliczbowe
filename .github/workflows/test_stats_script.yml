name: TEST update_eurojackpot_stats.py (diagnostyka, bez commitu)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Uruchom skrypt
        run: python3 update_eurojackpot_stats.py

      - name: Pokaz czy cos sie zmienilo (powinno byc puste, bo dane sa juz aktualne)
        run: |
          echo "=== git diff --stat ==="
          git diff --stat
          echo "=== git diff (pelny) ==="
          git diff
