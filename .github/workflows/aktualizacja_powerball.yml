name: Aktualizacja Powerball CSV

# Zrodlo (data.ny.gov) dodaje nowe losowanie ok. 07:39 UTC dzien po losowaniu.
# Zadanie startuje przed ta godzina i sprawdza zrodlo co 2 min, wiec wynik trafia
# na GitHub kilka minut po publikacji. Drugi termin to zapas.
on:
  schedule:
    - cron: '25 7 * * 2,4,0'
    - cron: '40 8 * * 2,4,0'
  workflow_dispatch:

concurrency:
  group: aktualizacja-powerball
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Czekaj na nowe dane (sprawdzaj co 2 min, do 90 min)
        id: czekaj
        run: |
          cat > konwertuj.py <<'EOF'
          import csv

          with open("powerball_surowe.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))

          out = []
          idx = 0
          for row in rows:
              date_raw = row["draw_date"][:10]
              if date_raw < "2015-10-07":
                  continue
              y, m, d = date_raw.split("-")
              nums = [int(n) for n in row["winning_numbers"].split()]
              main = sorted(nums[:5])
              pb = nums[5]
              idx += 1
              out.append(
                  f"{idx:04d},{d}.{m}.{y}," + ",".join(f"{n:02d}" for n in main) + f",{pb:02d}"
              )

          with open("powerball_nowy.csv", "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(out) + "\n")

          print(f"Przekonwertowano {len(out)} losowan")
          EOF

          nowe=false
          for i in $(seq 1 45); do
            if curl -sL --fail --retry 2 \
                 -o powerball_surowe.csv \
                 "https://data.ny.gov/resource/d6yy-54nr.csv?\$limit=3000&\$order=draw_date%20ASC" \
               && python3 konwertuj.py \
               && head -1 powerball_nowy.csv | grep -q "^0001," \
               && [ $(wc -l < powerball_nowy.csv) -ge 1380 ]; then
              if ! diff -q powerball.csv powerball_nowy.csv > /dev/null 2>&1; then
                nowe=true
                echo "Nowe dane po $i probach"
                break
              fi
            fi
            sleep 120
          done
          rm -f konwertuj.py powerball_surowe.csv
          echo "nowe=$nowe" >> "$GITHUB_OUTPUT"
          [ "$nowe" = "true" ] || echo "Brak nowych danych - pomijam"

      - name: Wgraj nowe dane
        if: steps.czekaj.outputs.nowe == 'true'
        run: |
          mv powerball_nowy.csv powerball.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add powerball.csv
          git commit -m "Aktualizacja wynikow Powerball $(date +%Y-%m-%d)"
          git push
          echo "Zaktualizowano!"
