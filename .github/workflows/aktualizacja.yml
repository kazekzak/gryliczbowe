name: Aktualizacja EuroJackpot CSV

# Start punktualny: zewnetrzny wyzwalacz (workflow_dispatch przez API) uruchamia zadanie tuz
# przed publikacja wynikow; zadanie sprawdza zrodlo co minute i wgrywa wynik od razu.
# Terminy z harmonogramu (schedule) to tylko zapas: GitHub spoznia je o godziny,
# wiec robia jedno sprawdzenie i koncza (bez czekania).
#
# Strony HTML ze statystykami sa przeliczane ZAWSZE z eurojackpot.csv z repozytorium
# (krok 2), niezaleznie od tego, kto wgral CSV (to zadanie czy lokalny skrypt na PC).
# Dzieki temu reczne wgranie samego CSV nie zostawia stron w tyle.
on:
  schedule:
    - cron: '15 18 * * 2,5'
    - cron: '45 20 * * 2,5'
  workflow_dispatch:

concurrency:
  group: aktualizacja-eurojackpot
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Przelicz strony ze statystykami z CSV w repozytorium
        run: |
          python3 update_eurojackpot_stats.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            eurojackpot-statystyki.html eurojackpot-wyniki.html \
            en/eurojackpot-statistics.html en/eurojackpot-results.html \
            de/eurojackpot-statistiken.html de/eurojackpot-ergebnisse.html \
            fr/eurojackpot-statistiques.html fr/eurojackpot-resultats.html \
            it/statistiche-eurojackpot.html it/risultati-eurojackpot.html
          if git diff --cached --quiet; then
            echo "Strony aktualne - bez zmian"
          else
            git commit -m "Odswiezenie statystyk EuroJackpot $(date +%Y-%m-%d)"
            git push
            echo "Strony odswiezone!"
          fi

      - name: Czekaj na nowe dane (co 1 min, do 3 godzin; z harmonogramu tylko jedno sprawdzenie)
        id: czekaj
        run: |
          nowe=false
          max=180
          [ "$GITHUB_EVENT_NAME" = "schedule" ] && max=1
          for i in $(seq 1 $max); do
            if curl -sL --fail --retry 2 \
                 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 -H "Accept: text/csv,text/plain,*/*" \
                 -H "Accept-Language: pl-PL,pl;q=0.9,en;q=0.8" \
                 -H "Referer: https://www.wynikilotto.net.pl/" \
                 -o eurojackpot_nowy.csv \
                 "https://www.wynikilotto.net.pl/download/eurojackpot.csv" \
               && head -1 eurojackpot_nowy.csv | grep -q "^0001," \
               && [ $(wc -l < eurojackpot_nowy.csv) -ge 900 ]; then
              if ! diff -q eurojackpot.csv eurojackpot_nowy.csv > /dev/null 2>&1; then
                nowe=true
                echo "Nowe dane po $i probach"
                break
              fi
            fi
            if [ $i -lt $max ]; then sleep 60; fi
          done
          echo "nowe=$nowe" >> "$GITHUB_OUTPUT"
          [ "$nowe" = "true" ] || echo "Brak nowych danych - pomijam"

      - name: Wgraj nowe dane
        if: steps.czekaj.outputs.nowe == 'true'
        run: |
          mv eurojackpot_nowy.csv eurojackpot.csv

          echo "Przeliczam statystyki na stronach HTML..."
          python3 update_eurojackpot_stats.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eurojackpot.csv \
            eurojackpot-statystyki.html eurojackpot-wyniki.html \
            en/eurojackpot-statistics.html en/eurojackpot-results.html \
            de/eurojackpot-statistiken.html de/eurojackpot-ergebnisse.html \
            fr/eurojackpot-statistiques.html fr/eurojackpot-resultats.html \
            it/statistiche-eurojackpot.html it/risultati-eurojackpot.html
          git commit -m "Aktualizacja wynikow EuroJackpot $(date +%Y-%m-%d)"
          git push
          echo "Zaktualizowano!"
