name: Aktualizacja Duzy Lotek CSV

# Zadanie startuje przed publikacja wynikow i samo sprawdza zrodlo co 3 min,
# wiec wynik trafia na GitHub kilka minut po publikacji (a nie kiedy GitHub
# raczy uruchomic zadanie z harmonogramu). Drugi termin to zapas.
on:
  schedule:
    - cron: '50 19 * * 2,4,6'
    - cron: '30 22 * * 2,4,6'
  workflow_dispatch:

concurrency:
  group: aktualizacja-duzylotek
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Czekaj na nowe dane (sprawdzaj co 3 min, do 5 godzin)
        id: czekaj
        run: |
          nowe=false
          for i in $(seq 1 100); do
            if curl -sL --fail --retry 2 \
                 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                 -H "Accept: text/csv,text/plain,*/*" \
                 -H "Accept-Language: pl-PL,pl;q=0.9,en;q=0.8" \
                 -H "Referer: https://www.wynikilotto.net.pl/" \
                 -o duzylotek_nowy.csv \
                 "https://www.wynikilotto.net.pl/download/lotto.csv" \
               && head -1 duzylotek_nowy.csv | grep -q "^0001," \
               && [ $(wc -l < duzylotek_nowy.csv) -ge 7000 ]; then
              if ! diff -q duzylotek.csv duzylotek_nowy.csv > /dev/null 2>&1; then
                nowe=true
                echo "Nowe dane po $i probach"
                break
              fi
            fi
            sleep 180
          done
          echo "nowe=$nowe" >> "$GITHUB_OUTPUT"
          [ "$nowe" = "true" ] || echo "Brak nowych danych - pomijam"

      - name: Wgraj nowe dane
        if: steps.czekaj.outputs.nowe == 'true'
        run: |
          mv duzylotek_nowy.csv duzylotek.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add duzylotek.csv
          git commit -m "Aktualizacja wynikow Duzy Lotek $(date +%Y-%m-%d)"
          git push
          echo "Zaktualizowano!"
