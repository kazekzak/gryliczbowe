name: Aktualizacja Duzy Lotek CSV

on:
  schedule:
    - cron: '30 19 * * 2,4,6'
    - cron: '30 20 * * 2,4,6'
  workflow_dispatch:

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pobierz lotto.csv
        run: |
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Accept-Language: pl-PL,pl;q=0.9,en;q=0.8" \
            -H "Referer: https://www.wynikilotto.net.pl/" \
            -o duzylotek_nowy.csv \
            "https://www.wynikilotto.net.pl/download/lotto.csv"
          echo "Pobrano $(wc -l < duzylotek_nowy.csv) wierszy"

      - name: Walidacja pobranego pliku
        run: |
          if ! head -1 duzylotek_nowy.csv | grep -q "^0001,"; then
            echo "BLAD: plik nie zaczyna sie od danych CSV - przerywam"
            head -5 duzylotek_nowy.csv
            exit 1
          fi
          if [ $(wc -l < duzylotek_nowy.csv) -lt 7000 ]; then
            echo "BLAD: plik podejrzanie krotki - przerywam"
            exit 1
          fi
          echo "Walidacja OK"

      - name: Porownaj i wgraj jesli nowe dane
        run: |
          if diff -q duzylotek.csv duzylotek_nowy.csv > /dev/null 2>&1; then
            echo "Brak nowych danych - pomijam"
          else
            mv duzylotek_nowy.csv duzylotek.csv
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add duzylotek.csv
            git commit -m "Aktualizacja wynikow Duzy Lotek $(date +%Y-%m-%d)"
            git push
            echo "Zaktualizowano!"
          fi
